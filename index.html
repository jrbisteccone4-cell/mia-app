<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Anomalia // Global Glitch Radar Pro X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            font-family: 'Inter', sans-serif;
            background-color: #000002;
            color: #f3f4f6;
            width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            user-select: none; -webkit-user-select: none;
        }
        h1, h2, h3, .font-space { font-family: 'Space Grotesk', sans-serif; }
        .glass-panel {
            background: rgba(10, 10, 18, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.6);
            outline: none;
        }
        #webgl-container {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; pointer-events: auto;
        }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive-ui { pointer-events: auto; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.5); border-radius: 4px; }

        /* HUD Radar Circle Overlay */
        .radar-hud {
            position: absolute; bottom: 20px; right: 20px; width: 90px; height: 90px;
            border: 1px dashed rgba(99, 102, 241, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5;
            opacity: 0.6;
        }
        .radar-scanner {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(99, 102, 241, 0) 0deg, rgba(99, 102, 241, 0.4) 360deg);
            animation: radarRotate 4s linear infinite;
        }
        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-6 h-full w-full">

    <div id="webgl-container"></div>

    <!-- HUD RADAR OVERLAY -->
    <div class="radar-hud ui-layer hidden sm:flex">
        <div class="radar-scanner"></div>
        <div class="absolute w-2 h-2 rounded-full bg-indigo-400 animate-ping"></div>
    </div>

    <!-- HEADER -->
    <header class="ui-layer flex justify-between items-center w-full max-w-7xl mx-auto p-1">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-ping"></div>
                <span class="font-space tracking-widest text-[9px] sm:text-xs uppercase text-indigo-300 font-semibold">ANOMALIA // v6.0 PRO X</span>
            </div>
            <div onclick="openNetworkModal()" class="interactive-ui glass-panel px-2.5 py-1 rounded-full flex items-center space-x-1.5 cursor-pointer hover:border-indigo-500/50 transition">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span id="online-count-badge" class="text-[9px] font-space text-gray-300">1 Online</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Audio Spaziale Toggle -->
            <button id="audio-toggle-btn" onclick="toggleSpaceAudio()" class="interactive-ui glass-panel px-2.5 py-1.5 rounded-full flex items-center space-x-1 text-[10px] text-gray-400 hover:text-white transition">
                <span>🔇 Audio</span>
            </button>

            <!-- Profilo Utente -->
            <div class="interactive-ui glass-panel px-3 py-1.5 rounded-full flex items-center space-x-2.5 cursor-pointer hover:border-indigo-500/50 transition" onclick="openProfileModal()">
                <div class="w-8 h-8 rounded-full overflow-hidden bg-indigo-950 border border-indigo-500/40 flex-shrink-0">
                    <img id="user-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-full h-full object-cover">
                </div>
                <div class="text-left leading-tight truncate max-w-[100px] sm:max-w-xs">
                    <div id="username-display" class="text-[11px] font-space font-medium text-white truncate">@CosmicDrifter</div>
                    <div class="text-[8px] text-emerald-400">Cloud Active</div>
                </div>
            </div>
        </div>
    </header>

    <!-- CENTRO INTERATTIVO -->
    <main class="ui-layer flex flex-col items-center justify-center flex-grow w-full max-w-sm mx-auto text-center p-2 relative">
        
        <div id="action-trigger" class="interactive-ui cursor-pointer group">
            <div class="glass-panel w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:border-indigo-500 transition duration-300 shadow-2xl">
                <svg class="w-8 h-8 text-indigo-400 group-hover:scale-110 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <span class="font-space text-[10px] sm:text-xs tracking-wider text-gray-300 group-hover:text-white transition">CATTURA ANOMALIA</span>
        </div>

        <!-- Pannello Inserimento Anomalia -->
        <div id="input-panel" class="interactive-ui glass-panel w-full p-4 rounded-2xl hidden flex-col text-left space-y-3 max-h-[75vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Nuovo Glitch Multimediale</h3>
                <button id="close-panel" class="text-gray-400 hover:text-white font-bold text-sm p-1">✕</button>
            </div>

            <textarea id="anomaly-text" rows="2" class="glass-input w-full p-2.5 rounded-xl text-xs text-white resize-none" placeholder="Descrivi l'anomalia..."></textarea>

            <div>
                <label class="text-[9px] text-gray-400 uppercase block mb-1">Allega Immagine o Video Breve</label>
                <input type="text" id="anomaly-media-url" class="glass-input w-full p-2 rounded-xl text-xs text-white mb-2 hidden" placeholder="Incolla link...">
                <input type="file" id="anomaly-file-input" accept="image/*,video/*" class="text-[10px] text-gray-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-space file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 w-full">
            </div>

            <div class="bg-white/5 p-2.5 rounded-xl border border-white/10 space-y-1">
                <label class="text-[9px] text-indigo-300 uppercase font-space block">Visibilità Contenuto</label>
                <div class="flex items-center space-x-4 text-[11px]">
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="visibility-type" value="friends" checked class="accent-indigo-500">
                        <span>Solo Amici</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="visibility-type" value="public" class="accent-indigo-500">
                        <span>Pubblico (Tutti)</span>
                    </label>
                </div>
            </div>

            <button id="submit-anomaly" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-space text-[11px] uppercase tracking-widest transition shadow-lg">
                Trasmetti nel Globo Live
            </button>
        </div>

        <div id="live-notifications-container" class="interactive-ui w-full space-y-3 mt-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1"></div>

    </main>

    <!-- MODALE ZOOM -->
    <div id="media-zoom-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex flex-col items-center justify-center p-2">
        <button onclick="closeMediaZoom()" class="absolute top-4 right-4 text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full z-50 text-sm font-bold w-10 h-10 flex items-center justify-center">✕</button>
        <div id="zoom-content-container" class="w-full h-full flex items-center justify-center p-2 overflow-auto"></div>
    </div>

    <!-- MODALE NETWORK -->
    <div id="network-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Radar Network Reale</h3>
                    <p id="modal-online-sub" class="text-[10px] text-gray-400">Utenti connessi nel cloud</p>
                </div>
                <button onclick="closeNetworkModal()" class="text-gray-400 hover:text-white font-bold text-sm p-1">✕</button>
            </div>

            <div class="relative">
                <input type="text" id="user-search-input" oninput="filterCloudUsers(this.value)" placeholder="Cerca @username..." class="glass-input w-full py-2 px-3 pl-8 rounded-xl text-xs text-white">
                <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <div id="users-list-container" class="space-y-2 overflow-y-auto flex-grow max-h-60 pr-1 custom-scrollbar"></div>

            <button onclick="closeNetworkModal()" class="w-full py-2 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] text-gray-300 transition">Chiudi</button>
        </div>
    </div>

    <!-- MODALE PROFILO -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-3">
            <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Modifica Profilo</h3>
            
            <div class="flex flex-col items-center justify-center space-y-2 py-2">
                <div class="w-16 h-16 rounded-full overflow-hidden bg-indigo-950 border border-indigo-500/50 shadow-lg">
                    <img id="modal-avatar-preview-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-full h-full object-cover">
                </div>
                <label class="text-[10px] text-indigo-400 font-space uppercase cursor-pointer bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 transition">
                    📁 Cambia Foto Profilo
                    <input type="file" id="profile-file-input" accept="image/*" class="hidden" onchange="previewProfileImage(this)">
                </label>
            </div>

            <div>
                <label class="text-[9px] text-gray-400 uppercase">Username</label>
                <input type="text" id="modal-username-input" class="glass-input w-full p-2 rounded-xl text-xs text-white mt-1" value="@CosmicDrifter">
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="saveProfile()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-[11px] font-space uppercase tracking-wider text-white transition">Salva Profilo</button>
                <button onclick="closeProfileModal()" class="py-2 px-4 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] text-gray-300 transition">Chiudi</button>
            </div>
        </div>
    </div>

    <footer class="ui-layer flex justify-between items-center w-full max-w-7xl mx-auto text-[9px] sm:text-xs text-gray-500 p-1">
        <p>Globo 3D interattivo con Spazio e Post-Processing Bloom.</p>
        <p class="font-space">Cloud Active</p>
    </footer>

    <!-- IMPORT MAPS PER THREE.JS E POSTPROCESSING -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- AUDIO SPAZIALE PROCEDURALE ---
        let audioCtx = null;
        let audioInterval = null;
        window.toggleSpaceAudio = function() {
            const btn = document.getElementById('audio-toggle-btn');
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioInterval = setInterval(() => {
                    if(audioCtx && audioCtx.state === 'running') {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(65 + Math.random() * 40, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 3);
                    }
                }, 3500);
                btn.innerHTML = "🔊 Audio ON";
                btn.classList.add('border-indigo-500', 'text-white');
            } else {
                if(audioCtx.state === 'running') {
                    audioCtx.suspend();
                    btn.innerHTML = "🔇 Audio";
                    btn.classList.remove('border-indigo-500', 'text-white');
                } else {
                    audioCtx.resume();
                    btn.innerHTML = "🔊 Audio ON";
                    btn.classList.add('border-indigo-500', 'text-white');
                }
            }
        }

        // --- CONFIGURAZIONE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAUe3Yqx8OaLDf-i2ATQW1zpQp9hyAZkE8",
            authDomain: "anomaly-108cf.firebaseapp.com",
            projectId: "anomaly-108cf",
            storageBucket: "anomaly-108cf.firebasestorage.app",
            messagingSenderId: "938106921666",
            appId: "1:938106921666:web:fd1b0cdcd44091fb56115b",
            measurementId: "G-0JCR7E7GR4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myId = localStorage.getItem('anomalia_my_id');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('anomalia_my_id', myId);
        }

        let savedUser = localStorage.getItem('anomalia_username') || '@CosmicDrifter';
        let savedAvatar = localStorage.getItem('anomalia_avatar') || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';
        
        document.getElementById('username-display').innerText = savedUser;
        document.getElementById('user-avatar-preview').src = savedAvatar;
        document.getElementById('modal-username-input').value = savedUser;
        document.getElementById('modal-avatar-preview-img').src = savedAvatar;

        function updateMyOnlinePresence() {
            if(!savedUser || savedUser.trim() === "") return;
            db.collection("users").doc(myId).set({
                id: myId,
                username: savedUser,
                avatar: savedAvatar,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                updateGlobalOnlineCount();
            });
        }
        updateMyOnlinePresence();
        setInterval(updateMyOnlinePresence, 20000);

        function updateGlobalOnlineCount() {
            db.collection("users").get().then((snapshot) => {
                const now = new Date().getTime();
                let activeCount = 0;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.lastSeen && data.username) {
                        if((now - data.lastSeen.toDate().getTime()) < 60000) activeCount++;
                    }
                });
                if(activeCount === 0) activeCount = 1;
                document.getElementById('online-count-badge').innerText = `${activeCount} Online`;
            });
        }
        updateGlobalOnlineCount();
        setInterval(updateGlobalOnlineCount, 15000);

        let myFriendsIds = [myId]; 
        let friendDocIds = {}; 
        let pendingRequestsMap = {}; 

        function fetchMyFriends() {
            return Promise.all([
                db.collection("friend_requests").where("toId", "==", myId).get(),
                db.collection("friend_requests").where("fromId", "==", myId).get()
            ]).then(([snapshotTo, snapshotFrom]) => {
                myFriendsIds = [myId];
                friendDocIds = {};
                pendingRequestsMap = {};

                snapshotTo.forEach(doc => { 
                    const data = doc.data();
                    if (data.status === "accepted") {
                        myFriendsIds.push(data.fromId); 
                        friendDocIds[data.fromId] = doc.id;
                    } else if (data.status === "pending") {
                        pendingRequestsMap[data.fromId] = { reqId: doc.id, type: 'incoming' };
                    }
                });

                snapshotFrom.forEach(doc => { 
                    const data = doc.data();
                    if (data.status === "accepted") {
                        myFriendsIds.push(data.toId); 
                        friendDocIds[data.toId] = doc.id;
                    } else if (data.status === "pending") {
                        pendingRequestsMap[data.toId] = { reqId: doc.id, type: 'outgoing' };
                    }
                });
            });
        }
        fetchMyFriends();

        function getDismissedItems() {
            try { return JSON.parse(localStorage.getItem('anomalia_dismissed') || '[]'); } catch(e) { return []; }
        }

        function dismissItem(itemId) {
            let dismissed = getDismissedItems();
            if(!dismissed.includes(itemId)) {
                dismissed.push(itemId);
                localStorage.setItem('anomalia_dismissed', JSON.stringify(dismissed));
            }
            const el = document.getElementById(itemId);
            if(el) el.remove();
        }

        // --- THREE.JS GLOBE CON POST-PROCESSING BLOOM E ARCHI DI CONNESSIONE ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Post-processing Composer & Bloom Pass
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85);
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4.3;
        controls.maxDistance = 25;
        controls.enablePan = false; 
        controls.target.set(0, 0, 0);
        controls.touches.ONE = THREE.TOUCH.ROTATE;
        controls.touches.TWO = THREE.TOUCH.DOLLY;

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(6, 3, 5);
        scene.add(sunLight);

        const globeRadius = 3.2;
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const bumpTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
        const specularTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

        const earthMesh = new THREE.Mesh(
            new THREE.SphereGeometry(globeRadius, 64, 64),
            new THREE.MeshStandardMaterial({
                map: earthTexture,
                bumpMap: bumpTexture,
                bumpScale: 0.04,
                roughnessMap: specularTexture,
                roughness: 0.5,
                metalness: 0.1
            })
        );
        earthGroup.add(earthMesh);

        const cloudsTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png');
        const cloudsMesh = new THREE.Mesh(
            new THREE.SphereGeometry(globeRadius * 1.015, 64, 64),
            new THREE.MeshStandardMaterial({
                map: cloudsTexture,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            })
        );
        earthGroup.add(cloudsMesh);

        // Gruppo Archi di Connessione Globale (Linee fra punti del globo)
        const arcsGroup = new THREE.Group();
        earthGroup.add(arcsGroup);

        function addConnectionArc(lat1, lon1, lat2, lon2) {
            const phi1 = (90 - lat1) * (Math.PI / 180);
            const theta1 = (lon1 + 180) * (Math.PI / 180);
            const p1 = new THREE.Vector3(
                -globeRadius * Math.sin(phi1) * Math.cos(theta1),
                globeRadius * Math.cos(phi1),
                globeRadius * Math.sin(phi1) * Math.sin(theta1)
            );

            const phi2 = (90 - lat2) * (Math.PI / 180);
            const theta2 = (lon2 + 180) * (Math.PI / 180);
            const p2 = new THREE.Vector3(
                -globeRadius * Math.sin(phi2) * Math.cos(theta2),
                globeRadius * Math.cos(phi2),
                globeRadius * Math.sin(phi2) * Math.sin(theta2)
            );

            const mid = p1.clone().add(p2).multiplyScalar(0.5);
            mid.normalize().multiplyScalar(globeRadius * 1.4);

            const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
            const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.6 });
            const arcLine = new THREE.Line(geometry, material);
            arcsGroup.add(arcLine);
        }

        // Aggiungiamo qualche arco di connessione iniziale di esempio
        addConnectionArc(40.85, 14.26, 37.77, -122.41); // Napoli -> San Francisco
        addConnectionArc(40.85, 14.26, 35.67, 139.65);  // Napoli -> Tokyo

        // Spazio Stellato
        const starsCount = 2000;
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = new Float32Array(starsCount * 3);
        const starsSpeeds = new Float32Array(starsCount);

        for (let i = 0; i < starsCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 250 + Math.random() * 400;

            starsPositions[i] = r * Math.sin(phi) * Math.cos(theta);
            starsPositions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            starsPositions[i + 2] = r * Math.cos(phi);

            starsSpeeds[i / 3] = 0.0001 + Math.random() * 0.0003;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));

        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const starCtx = starCanvas.getContext('2d');
        const gradient = starCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.5, 'rgba(200,220,255,0.8)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        starCtx.fillStyle = gradient;
        starCtx.fillRect(0, 0, 32, 32);

        const starTexture = new THREE.CanvasTexture(starCanvas);
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff, size: 2.2, map: starTexture,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });

        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            earthGroup.rotation.y += 0.0008;
            cloudsMesh.rotation.y += 0.001;

            const positions = starsGeometry.attributes.position.array;
            for (let i = 0; i < starsCount; i++) {
                let x = positions[i * 3];
                let z = positions[i * 3 + 2];
                const speed = starsSpeeds[i];
                const cos = Math.cos(speed);
                const sin = Math.sin(speed);
                positions[i * 3] = x * cos - z * sin;
                positions[i * 3 + 2] = z * cos + x * sin;
            }
            starsGeometry.attributes.position.needsUpdate = true;

            controls.update();
            composer.render();
        }
        animate();

        // --- GESTIONE NOTIFICHE & AMICIZIE ---
        const liveNotifsContainer = document.getElementById('live-notifications-container');

        db.collection("friend_requests")
          .where("toId", "==", myId)
          .where("status", "==", "pending")
          .onSnapshot((snapshot) => {
              snapshot.docChanges().forEach((change) => {
                  if (change.type === "added") {
                      const req = change.doc.data();
                      showFriendRequestNotification(change.doc.id, req.fromUsername);
                  }
              });
          });

        function showFriendRequestNotification(reqId, fromName) {
            const notifId = 'req_' + reqId;
            if(getDismissedItems().includes(notifId) || document.getElementById(notifId)) return;

            const div = document.createElement('div');
            div.id = notifId;
            div.className = "glass-panel p-3 rounded-xl border-l-2 border-emerald-400 text-left space-y-2 relative";
            div.innerHTML = `
                <button onclick="dismissItem('${notifId}')" class="absolute top-2 right-2 text-gray-400 hover:text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full bg-white/5 transition" title="Chiudi">✕</button>
                <div class="text-[9px] font-space text-emerald-400 uppercase tracking-widest pr-6">Richiesta d'Amicizia</div>
                <p class="text-[11px] text-white"><b>${fromName}</b> vuole aggiungerti agli amici.</p>
                <div class="flex space-x-2 pt-1">
                    <button onclick="acceptFriendRequest('${reqId}', '${notifId}')" class="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-[10px] font-space text-white uppercase">Accetta</button>
                    <button onclick="rejectFriendRequest('${reqId}', '${notifId}')" class="py-1.5 px-3 bg-rose-600/85 hover:bg-rose-600 rounded-lg text-[10px] font-space text-white uppercase">Rifiuta</button>
                </div>
            `;
            liveNotifsContainer.prepend(div);
        }

        window.acceptFriendRequest = function(reqId, divId) {
            db.collection("friend_requests").doc(reqId).update({ status: "accepted" })
              .then(() => {
                  if(divId) dismissItem(divId);
                  fetchMyFriends().then(() => {
                      loadAnomaliesFeed();
                      if(!document.getElementById('network-modal').classList.contains('hidden')) {
                          fetchOnlineUsers(document.getElementById('user-search-input').value);
                      }
                  });
              });
        }

        window.rejectFriendRequest = function(reqId, divId) {
            db.collection("friend_requests").doc(reqId).delete()
              .then(() => {
                  if(divId) dismissItem(divId);
                  fetchMyFriends().then(() => {
                      if(!document.getElementById('network-modal').classList.contains('hidden')) {
                          fetchOnlineUsers(document.getElementById('user-search-input').value);
                      }
                  });
              });
        }

        function loadAnomaliesFeed() {
            db.collection("anomalies")
              .orderBy("timestamp", "desc")
              .limit(20)
              .onSnapshot((snapshot) => {
                  document.querySelectorAll('[id^="card_"]').forEach(el => el.remove());
                  const dismissed = getDismissedItems();

                  snapshot.forEach((doc) => {
                      const cardId = 'card_' + doc.id;
                      if(dismissed.includes(cardId)) return;

                      const data = doc.data();
                      if (data.visibility === 'public' || myFriendsIds.includes(data.userId)) {
                          renderAnomalyCard(cardId, data);
                      }
                  });
              });
        }
        setTimeout(() => { loadAnomaliesFeed(); }, 500);

        function renderAnomalyCard(cardId, data) {
            if(document.getElementById(cardId)) return;

            const div = document.createElement('div');
            div.id = cardId;
            div.className = "glass-panel p-3 rounded-xl border-l-2 border-indigo-500 text-left space-y-2 mb-2 w-full relative";
            
            let mediaHtml = '';
            if(data.mediaUrl && data.mediaUrl.length > 0) {
                let itemsList = '';
                data.mediaUrl.forEach(url => {
                    if(url.startsWith('data:video') || url.match(/\.(mp4|webm|ogg|mov)(\?.*)?$/i)) {
                        itemsList += `
                            <div class="flex-shrink-0 w-36 h-28 bg-black/50 rounded-lg overflow-hidden border border-indigo-500/30 relative cursor-pointer group" onclick="openMediaZoom('video', '${url}')">
                                <video src="${url}" class="w-full h-full object-cover"></video>
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center"><svg class="w-8 h-8 text-white drop-shadow" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                            </div>`;
                    } else {
                        itemsList += `
                            <div class="flex-shrink-0 w-36 h-28 bg-black/50 rounded-lg overflow-hidden border border-indigo-500/30 relative cursor-pointer group" onclick="openMediaZoom('image', '${url}')">
                                <img src="${url}" class="w-full h-full object-cover">
                            </div>`;
                    }
                });
                mediaHtml = `<div class="flex space-x-2 overflow-x-auto py-1 custom-scrollbar w-full">${itemsList}</div>`;
            }

            div.innerHTML = `
                <button onclick="dismissItem('${cardId}')" class="absolute top-2 right-2 text-gray-400 hover:text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full bg-white/5 transition" title="Chiudi">✕</button>
                <div class="text-[9px] font-space text-indigo-400 uppercase tracking-widest flex justify-between pr-6">
                    <span>${data.visibility === 'public' ? 'Glitch Pubblico' : 'Glitch Privato (Amici)'}</span>
                    <span class="text-white font-bold">${data.username}</span>
                </div>
                <p class="text-[11px] text-gray-200 font-medium">"${data.text}"</p>
                ${mediaHtml}
            `;
            liveNotifsContainer.appendChild(div);
        }

        const zoomModal = document.getElementById('media-zoom-modal');
        const zoomContainer = document.getElementById('zoom-content-container');

        window.openMediaZoom = function(type, url) {
            zoomContainer.innerHTML = '';
            if(type === 'video') {
                zoomContainer.innerHTML = `<video src="${url}" controls autoplay playsinline class="max-w-full max-h-[85vh] rounded-xl shadow-2xl"></video>`;
            } else {
                zoomContainer.innerHTML = `<img src="${url}" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl">`;
            }
            zoomModal.classList.remove('hidden');
        }
        window.closeMediaZoom = function() { zoomModal.classList.add('hidden'); zoomContainer.innerHTML = ''; }

        const networkModal = document.getElementById('network-modal');
        window.openNetworkModal = function() { networkModal.classList.remove('hidden'); fetchMyFriends().then(() => fetchOnlineUsers()); }
        window.closeNetworkModal = function() { networkModal.classList.add('hidden'); }

        function fetchOnlineUsers(searchQuery = "") {
            const containerEl = document.getElementById('users-list-container');
            containerEl.innerHTML = '';

            db.collection("users").get().then((querySnapshot) => {
                containerEl.innerHTML = '';
                let count = 0;
                const now = new Date().getTime();

                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    if(userData.id === myId || !userData.username || !userData.lastSeen) return;
                    if((now - userData.lastSeen.toDate().getTime()) > 60000) return;

                    if(searchQuery && !userData.username.toLowerCase().includes(searchQuery.toLowerCase().trim())) return;

                    count++;
                    const isAlreadyFriend = myFriendsIds.includes(userData.id);
                    const pendingInfo = pendingRequestsMap[userData.id];

                    let actionBtnHtml = '';
                    if (isAlreadyFriend) {
                        actionBtnHtml = `<button onclick="removeFriend('${userData.id}', '${userData.username}')" class="px-2.5 py-1.5 rounded-lg text-[9px] font-space uppercase bg-rose-600/85 hover:bg-rose-600 text-white transition">- Elimina</button>`;
                    } else if (pendingInfo && pendingInfo.type === 'incoming') {
                        actionBtnHtml = `
                            <div class="flex space-x-1">
                                <button onclick="acceptFriendRequest('${pendingInfo.reqId}')" class="px-2 py-1.5 rounded-lg text-[9px] font-space uppercase bg-emerald-600 hover:bg-emerald-500 text-white transition">Accetta</button>
                                <button onclick="rejectFriendRequest('${pendingInfo.reqId}')" class="px-2 py-1.5 rounded-lg text-[9px] font-space uppercase bg-rose-600/85 hover:bg-rose-600 text-white transition">Rifiuta</button>
                            </div>`;
                    } else if (pendingInfo && pendingInfo.type === 'outgoing') {
                        actionBtnHtml = `<span class="text-[9px] text-amber-400 font-space uppercase px-2 py-1">In attesa</span>`;
                    } else {
                        actionBtnHtml = `<button onclick="sendRealRequest('${userData.id}', '${userData.username}')" class="px-3 py-1.5 rounded-lg text-[10px] font-space uppercase bg-indigo-600 hover:bg-indigo-500 text-white transition">+ Amicizia</button>`;
                    }

                    const avatarSrc = userData.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';

                    containerEl.innerHTML += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/5 border border-white/10">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-9 h-9 rounded-full overflow-hidden bg-indigo-950 border border-indigo-500/40 flex-shrink-0">
                                    <img src="${avatarSrc}" class="w-full h-full object-cover">
                                </div>
                                <div class="text-left">
                                    <div class="text-xs font-space text-white">${userData.username}</div>
                                    <div class="text-[9px] ${isAlreadyFriend ? 'text-indigo-400' : 'text-emerald-400'}">${isAlreadyFriend ? 'Amico Confermato' : 'Online nel Cloud'}</div>
                                </div>
                            </div>
                            ${actionBtnHtml}
                        </div>`;
                });

                if(count === 0) containerEl.innerHTML = `<p class="text-center text-gray-500 text-[11px] py-6">Nessun utente attivo trovato.</p>`;
                document.getElementById('online-count-badge').innerText = `${count + 1} Online`;
                document.getElementById('modal-online-sub').innerText = `${count + 1} utenti attivi globali`;
            });
        }

        window.filterCloudUsers = function(query) { fetchOnlineUsers(query); }

        window.sendRealRequest = function(targetUserId, targetUsername) {
            db.collection("friend_requests").add({
                fromId: myId,
                fromUsername: savedUser,
                toId: targetUserId,
                toUsername: targetUsername,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                fetchMyFriends().then(() => { fetchOnlineUsers(document.getElementById('user-search-input').value); });
            });
        }

        window.removeFriend = function(targetUserId, targetUsername) {
            if(!confirm(`Vuoi rimuovere l'amicizia con ${targetUsername}?`)) return;
            db.collection("friend_requests").get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    if((d.fromId === myId && d.toId === targetUserId) || (d.fromId === targetUserId && d.toId === myId)) {
                        db.collection("friend_requests").doc(doc.id).delete().then(() => {
                            fetchMyFriends().then(() => {
                                fetchOnlineUsers(document.getElementById('user-search-input').value);
                                loadAnomaliesFeed();
                            });
                        });
                    }
                });
            });
        }

        const actionTrigger = document.getElementById('action-trigger');
        const inputPanel = document.getElementById('input-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const submitBtn = document.getElementById('submit-anomaly');
        const anomalyText = document.getElementById('anomaly-text');
        const anomalyMediaUrl = document.getElementById('anomaly-media-url');
        const anomalyFileInput = document.getElementById('anomaly-file-input');

        actionTrigger.addEventListener('click', () => { actionTrigger.classList.add('hidden'); inputPanel.classList.remove('hidden'); inputPanel.classList.add('flex'); });
        closePanelBtn.addEventListener('click', () => { inputPanel.classList.add('hidden'); inputPanel.classList.remove('flex'); actionTrigger.classList.remove('hidden'); });

        const profileModal = document.getElementById('profile-modal');
        window.openProfileModal = function() { profileModal.classList.remove('hidden'); }
        window.closeProfileModal = function() { profileModal.classList.add('hidden'); }

        let tempNewAvatarBase64 = null;
        window.previewProfileImage = async function(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                tempNewAvatarBase64 = await compressImage(file, 400, 0.7);
                document.getElementById('modal-avatar-preview-img').src = tempNewAvatarBase64;
            }
        }

        window.saveProfile = function() {
            let rawName = document.getElementById('modal-username-input').value.trim();
            if(rawName) {
                if(!rawName.startsWith('@')) rawName = '@' + rawName;
                savedUser = rawName;
                localStorage.setItem('anomalia_username', savedUser);
                document.getElementById('username-display').innerText = savedUser;
            }
            if(tempNewAvatarBase64) {
                savedAvatar = tempNewAvatarBase64;
                localStorage.setItem('anomalia_avatar', savedAvatar);
                document.getElementById('user-avatar-preview').src = savedAvatar;
                tempNewAvatarBase64 = null;
            }
            updateMyOnlinePresence();
            closeProfileModal();
        }

        function compressImage(file, maxDim = 900, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
                        else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        submitBtn.addEventListener('click', async () => {
            const textValue = anomalyText.value.trim();
            if(!textValue) { alert("Inserisci una descrizione per l'anomalia."); return; }

            const visibilityChoice = document.querySelector('input[name="visibility-type"]:checked').value;
            let finalMediaUrl = anomalyMediaUrl.value.trim();
            const fileInput = anomalyFileInput.files[0];

            if (fileInput) {
                submitBtn.disabled = true;
                submitBtn.innerText = "OTTIMIZZAZIONE IN CORSO...";
                try {
                    if (fileInput.type.startsWith('image/')) {
                        finalMediaUrl = await compressImage(fileInput, 900, 0.75);
                    } else {
                        if(fileInput.size > 8 * 1024 * 1024) {
                            alert("Il video è troppo pesante. Scegli un video più corto.");
                            submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                            submitBtn.disabled = false;
                            return;
                        }
                        submitBtn.innerText = "CARICAMENTO VIDEO...";
                        finalMediaUrl = await readFileAsDataURL(fileInput);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Errore durante l'elaborazione del file.");
                    submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                    submitBtn.disabled = false;
                    return;
                }
            }

            db.collection("anomalies").add({
                userId: myId,
                username: savedUser,
                text: textValue,
                mediaUrl: finalMediaUrl ? [finalMediaUrl] : [],
                visibility: visibilityChoice,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Anomalia trasmessa con successo!");
                inputPanel.classList.add('hidden');
                inputPanel.classList.remove('flex');
                actionTrigger.classList.remove('hidden');
                anomalyText.value = '';
                anomalyMediaUrl.value = '';
                anomalyFileInput.value = '';
                submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                submitBtn.disabled = false;
            }).catch(() => {
                alert("Errore di registrazione nel database.");
                submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
