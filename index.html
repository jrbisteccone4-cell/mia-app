<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anomalia // Global Glitch Radar Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            font-family: 'Inter', sans-serif;
            background-color: #020205;
            color: #f3f4f6;
            width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }
        h1, h2, h3, .font-space { font-family: 'Space Grotesk', sans-serif; }
        .glass-panel {
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.6);
            outline: none;
        }
        #webgl-container {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; pointer-events: auto;
        }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive-ui { pointer-events: auto; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.5); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-6 h-full w-full">

    <div id="webgl-container"></div>

    <!-- HEADER -->
    <header class="ui-layer flex justify-between items-center w-full max-w-7xl mx-auto p-1">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-ping"></div>
                <span class="font-space tracking-widest text-[9px] sm:text-xs uppercase text-indigo-300 font-semibold">ANOMALIA // v5.2 PRO</span>
            </div>
            <!-- Badge Utenti Online -->
            <div onclick="openNetworkModal()" class="interactive-ui glass-panel px-2.5 py-1 rounded-full flex items-center space-x-1.5 cursor-pointer hover:border-indigo-500/50 transition">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span id="online-count-badge" class="text-[9px] font-space text-gray-300">Caricamento...</span>
            </div>
        </div>

        <!-- Profilo Utente -->
        <div class="interactive-ui glass-panel px-3 py-1.5 rounded-full flex items-center space-x-2.5 cursor-pointer hover:border-indigo-500/50 transition" onclick="openProfileModal()">
            <div class="w-8 h-8 rounded-full overflow-hidden bg-indigo-950 border border-indigo-500/40 flex-shrink-0">
                <img id="user-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-full h-full object-cover">
            </div>
            <div class="text-left leading-tight truncate max-w-[100px] sm:max-w-xs">
                <div id="username-display" class="text-[11px] font-space font-medium text-white truncate">@CosmicDrifter</div>
                <div class="text-[8px] text-emerald-400">Cloud Active</div>
            </div>
        </div>
    </header>

    <!-- CENTRO INTERATTIVO -->
    <main class="ui-layer flex flex-col items-center justify-center flex-grow w-full max-w-sm mx-auto text-center p-2 relative">
        
        <div id="action-trigger" class="interactive-ui cursor-pointer group">
            <div class="glass-panel w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:border-indigo-500 transition duration-300 shadow-2xl">
                <svg class="w-8 h-8 text-indigo-400 group-hover:scale-110 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <span class="font-space text-[10px] sm:text-xs tracking-wider text-gray-300 group-hover:text-white transition">CATTURA ANOMALIA</span>
        </div>

        <!-- Pannello Inserimento Anomalia -->
        <div id="input-panel" class="interactive-ui glass-panel w-full p-4 rounded-2xl hidden flex-col text-left space-y-3 max-h-[75vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Nuovo Glitch Multimediale</h3>
                <button id="close-panel" class="text-gray-400 hover:text-white font-bold text-sm p-1">✕</button>
            </div>

            <textarea id="anomaly-text" rows="2" class="glass-input w-full p-2.5 rounded-xl text-xs text-white resize-none" placeholder="Descrivi l'anomalia..."></textarea>

            <div>
                <label class="text-[9px] text-gray-400 uppercase block mb-1">Allega Immagine o Video Breve</label>
                <input type="text" id="anomaly-media-url" class="glass-input w-full p-2 rounded-xl text-xs text-white mb-2" placeholder="Incolla link immagine/video (opzionale)...">
                <input type="file" id="anomaly-file-input" accept="image/*,video/*" class="text-[10px] text-gray-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-space file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 w-full">
            </div>

            <!-- OPZIONE PRIVACY VISIBILITÀ -->
            <div class="bg-white/5 p-2.5 rounded-xl border border-white/10 space-y-1">
                <label class="text-[9px] text-indigo-300 uppercase font-space block">Visibilità Contenuto</label>
                <div class="flex items-center space-x-4 text-[11px]">
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="visibility-type" value="friends" checked class="accent-indigo-500">
                        <span>Solo Amici</span>
                    </label>
                    <label class="flex items-center space-x-1.5 cursor-pointer">
                        <input type="radio" name="visibility-type" value="public" class="accent-indigo-500">
                        <span>Pubblico (Tutti)</span>
                    </label>
                </div>
            </div>

            <button id="submit-anomaly" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-space text-[11px] uppercase tracking-widest transition shadow-lg">
                Trasmetti nel Globo Live
            </button>
        </div>

        <!-- Notifiche in tempo reale & Galleria Scorrevole -->
        <div id="live-notifications-container" class="interactive-ui w-full space-y-3 mt-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1"></div>

    </main>

    <!-- MODALE FULLSCREEN PER ZOOM IMMAGINI / VIDEO -->
    <div id="media-zoom-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex flex-col items-center justify-center p-2">
        <button onclick="closeMediaZoom()" class="absolute top-4 right-4 text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full z-50 text-sm font-bold w-10 h-10 flex items-center justify-center">✕</button>
        <div id="zoom-content-container" class="w-full h-full flex items-center justify-center p-2 overflow-auto">
            <!-- Inserito dinamicamente -->
        </div>
    </div>

    <!-- MODALE NETWORK & UTENTI REALI -->
    <div id="network-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Radar Network Reale</h3>
                    <p id="modal-online-sub" class="text-[10px] text-gray-400">Utenti connessi nel cloud</p>
                </div>
                <button onclick="closeNetworkModal()" class="text-gray-400 hover:text-white font-bold text-sm p-1">✕</button>
            </div>

            <div class="relative">
                <input type="text" id="user-search-input" oninput="filterCloudUsers(this.value)" placeholder="Cerca @username..." class="glass-input w-full py-2 px-3 pl-8 rounded-xl text-xs text-white">
                <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <div id="users-list-container" class="space-y-2 overflow-y-auto flex-grow max-h-60 pr-1 custom-scrollbar">
                <!-- Caricamento istantaneo senza testi lenti -->
            </div>

            <button onclick="closeNetworkModal()" class="w-full py-2 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] text-gray-300 transition">Chiudi</button>
        </div>
    </div>

    <!-- MODALE PROFILO -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-5 rounded-2xl space-y-3">
            <h3 class="font-space text-xs text-indigo-300 uppercase tracking-wider">Modifica Profilo</h3>
            <div>
                <label class="text-[9px] text-gray-400 uppercase">Username</label>
                <input type="text" id="modal-username-input" class="glass-input w-full p-2 rounded-xl text-xs text-white mt-1" value="@CosmicDrifter">
            </div>
            <div>
                <label class="text-[9px] text-gray-400 uppercase">Link Immagine Profilo (URL)</label>
                <input type="text" id="modal-avatar-input" class="glass-input w-full p-2 rounded-xl text-xs text-white mt-1" placeholder="https://...">
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="saveProfile()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-[11px] font-space uppercase tracking-wider text-white transition">Salva</button>
                <button onclick="closeProfileModal()" class="py-2 px-4 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] text-gray-300 transition">Chiudi</button>
            </div>
        </div>
    </div>

    <footer class="ui-layer flex justify-between items-center w-full max-w-7xl mx-auto text-[9px] sm:text-xs text-gray-500 p-1">
        <p>Terra 3D Interattiva.</p>
        <p class="font-space" id="node-count">Cloud Active</p>
    </footer>

    <!-- SDK FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // --- CONFIGURAZIONE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAUe3Yqx8OaLDf-i2ATQW1zpQp9hyAZkE8",
            authDomain: "anomaly-108cf.firebaseapp.com",
            projectId: "anomaly-108cf",
            storageBucket: "anomaly-108cf.firebasestorage.app",
            messagingSenderId: "938106921666",
            appId: "1:938106921666:web:fd1b0cdcd44091fb56115b",
            measurementId: "G-0JCR7E7GR4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GESTIONE UTENTE (PERSISTENTE SENZA RIGENERAZIONE BOT) ---
        let myId = localStorage.getItem('anomalia_my_id');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('anomalia_my_id', myId);
        }

        let savedUser = localStorage.getItem('anomalia_username');
        if (!savedUser) {
            savedUser = '@CosmicDrifter';
            localStorage.setItem('anomalia_username', savedUser);
        }

        let savedAvatar = localStorage.getItem('anomalia_avatar') || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';
        
        document.getElementById('username-display').innerText = savedUser;
        document.getElementById('user-avatar-preview').src = savedAvatar;
        document.getElementById('modal-username-input').value = savedUser;
        document.getElementById('modal-avatar-input').value = savedAvatar;

        function updateMyOnlinePresence() {
            db.collection("users").doc(myId).set({
                id: myId,
                username: savedUser,
                avatar: savedAvatar,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }
        updateMyOnlinePresence();
        setInterval(updateMyOnlinePresence, 60000);

        // --- PULIZIA TOTALE FORZATA VECCHI UTENTI ---
        function wipeUselessUsers() {
            db.collection("users").get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    if (doc.id !== myId) {
                        db.collection("users").doc(doc.id).delete();
                    }
                });
            });
        }
        wipeUselessUsers();

        // --- LISTA AMICI E MAPPA DOCUMENTI AMICIZIA ---
        let myFriendsIds = [myId]; 
        let friendDocIds = {}; 

        function fetchMyFriends() {
            return Promise.all([
                db.collection("friend_requests").where("toId", "==", myId).where("status", "==", "accepted").get(),
                db.collection("friend_requests").where("fromId", "==", myId).where("status", "==", "accepted").get()
            ]).then(([snapshotTo, snapshotFrom]) => {
                myFriendsIds = [myId];
                friendDocIds = {};
                snapshotTo.forEach(doc => { 
                    myFriendsIds.push(doc.data().fromId); 
                    friendDocIds[doc.data().fromId] = doc.id;
                });
                snapshotFrom.forEach(doc => { 
                    myFriendsIds.push(doc.data().toId); 
                    friendDocIds[doc.data().toId] = doc.id;
                });
            });
        }
        fetchMyFriends();

        // --- GESTIONE ELEMENTI NASCOSTI ---
        function getDismissedItems() {
            try {
                return JSON.parse(localStorage.getItem('anomalia_dismissed') || '[]');
            } catch(e) {
                return [];
            }
        }

        function dismissItem(itemId) {
            let dismissed = getDismissedItems();
            if(!dismissed.includes(itemId)) {
                dismissed.push(itemId);
                localStorage.setItem('anomalia_dismissed', JSON.stringify(dismissed));
            }
            const el = document.getElementById(itemId);
            if(el) el.remove();
        }

        // --- THREE.JS GLOBE SETUP ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraDistance() {
            if (window.innerWidth < window.innerHeight) camera.position.set(0, 0, 5.8);
            else camera.position.set(0, 0, 4.2);
        }
        updateCameraDistance();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(6, 3, 5);
        scene.add(sunLight);

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);
        const globeRadius = 1;

        function createRealEarthMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            let g1 = ctx.createRadialGradient(450, 400, 20, 450, 400, 300);
            g1.addColorStop(0, '#1e293b'); g1.addColorStop(1, '#080c14');
            ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(450, 400, 260, 0, Math.PI * 2); ctx.fill();
            let g2 = ctx.createRadialGradient(1080, 380, 20, 1080, 380, 320);
            g2.addColorStop(0, '#334155'); g2.addColorStop(0.6, '#1e293b'); g2.addColorStop(1, '#060911');
            ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(1080, 380, 300, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#38bdf8';
            for (let i = 0; i < 600; i++) {
                ctx.fillRect(Math.random() * canvas.width, 150 + Math.random() * 720, 1.2, 1.2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        earthGroup.add(new THREE.Mesh(
            new THREE.SphereGeometry(globeRadius, 64, 64),
            new THREE.MeshStandardMaterial({ map: createRealEarthMap(), roughness: 0.65, metalness: 0.2 })
        ));
        earthGroup.add(new THREE.Mesh(
            new THREE.SphereGeometry(globeRadius * 1.05, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending })
        ));

        let isDragging = false, previousMousePosition = { x: 0, y: 0 };
        window.addEventListener('pointerdown', (e) => { if (!e.target.closest('.interactive-ui')) { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; } });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            earthGroup.rotation.y += (e.clientX - previousMousePosition.x) * 0.005;
            earthGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, earthGroup.rotation.x + (e.clientY - previousMousePosition.y) * 0.005));
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) earthGroup.rotation.y += 0.0015;
            renderer.render(scene, camera);
        }
        animate();

        // --- ASCOLTO RICHIESTE AMICIZIA ---
        const liveNotifsContainer = document.getElementById('live-notifications-container');

        db.collection("friend_requests")
          .where("toId", "==", myId)
          .where("status", "==", "pending")
          .onSnapshot((snapshot) => {
              snapshot.docChanges().forEach((change) => {
                  if (change.type === "added") {
                      const req = change.doc.data();
                      showFriendRequestNotification(change.doc.id, req.fromUsername);
                  }
              });
          });

        function showFriendRequestNotification(reqId, fromName) {
            const notifId = 'req_' + reqId;
            if(getDismissedItems().includes(notifId)) return;
            if(document.getElementById(notifId)) return;

            const div = document.createElement('div');
            div.id = notifId;
            div.className = "glass-panel p-3 rounded-xl border-l-2 border-emerald-400 text-left space-y-2 relative";
            div.innerHTML = `
                <button onclick="dismissItem('${notifId}')" class="absolute top-2 right-2 text-gray-400 hover:text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full bg-white/5 transition" title="Chiudi scheda">✕</button>
                <div class="text-[9px] font-space text-emerald-400 uppercase tracking-widest pr-6">Richiesta d'Amicizia</div>
                <p class="text-[11px] text-white"><b>${fromName}</b> vuole aggiungerti agli amici.</p>
                <div class="flex space-x-2 pt-1">
                    <button onclick="acceptFriendRequest('${reqId}', '${notifId}')" class="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-[10px] font-space text-white uppercase">Accetta</button>
                    <button onclick="dismissItem('${notifId}')" class="py-1.5 px-3 bg-white/10 hover:bg-white/20 rounded-lg text-[10px] text-gray-300">Rifiuta</button>
                </div>
            `;
            liveNotifsContainer.prepend(div);
        }

        window.acceptFriendRequest = function(reqId, divId) {
            db.collection("friend_requests").doc(reqId).update({ status: "accepted" })
              .then(() => {
                  alert("Richiesta d'amicizia accettata!");
                  dismissItem(divId);
                  fetchMyFriends().then(() => loadAnomaliesFeed());
              });
        }

        // --- RICEZIONE ANOMALIE FILTRATE PER AMICIZIA ---
        function loadAnomaliesFeed() {
            db.collection("anomalies")
              .orderBy("timestamp", "desc")
              .limit(20)
              .onSnapshot((snapshot) => {
                  const existingAnomalies = document.querySelectorAll('[id^="card_"]');
                  existingAnomalies.forEach(el => el.remove());

                  const dismissed = getDismissedItems();

                  snapshot.forEach((doc) => {
                      const cardId = 'card_' + doc.id;
                      if(dismissed.includes(cardId)) return;

                      const data = doc.data();
                      const isPublic = data.visibility === 'public';
                      const isFriendOrMe = myFriendsIds.includes(data.userId);

                      if (isPublic || isFriendOrMe) {
                          renderAnomalyCard(cardId, data);
                      }
                  });
              });
        }
        
        setTimeout(() => { loadAnomaliesFeed(); }, 500);

        function renderAnomalyCard(cardId, data) {
            if(document.getElementById(cardId)) return;

            const div = document.createElement('div');
            div.id = cardId;
            div.className = "glass-panel p-3 rounded-xl border-l-2 border-indigo-500 text-left space-y-2 mb-2 w-full relative";
            
            let mediaHtml = '';
            if(data.mediaUrl) {
                const mediaItems = Array.isArray(data.mediaUrl) ? data.mediaUrl : [data.mediaUrl];
                let itemsList = '';
                mediaItems.forEach(url => {
                    if(url.startsWith('data:video') || url.match(/\.(mp4|webm|ogg|mov)(\?.*)?$/i)) {
                        itemsList += `
                            <div class="flex-shrink-0 w-36 h-28 bg-black/50 rounded-lg overflow-hidden border border-indigo-500/30 relative cursor-pointer group" onclick="openMediaZoom('video', '${url}')">
                                <video src="${url}" class="w-full h-full object-cover"></video>
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center group-hover:bg-black/10 transition">
                                    <svg class="w-8 h-8 text-white drop-shadow" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                            </div>`;
                    } else {
                        itemsList += `
                            <div class="flex-shrink-0 w-36 h-28 bg-black/50 rounded-lg overflow-hidden border border-indigo-500/30 relative cursor-pointer group" onclick="openMediaZoom('image', '${url}')">
                                <img src="${url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute bottom-1 right-1 bg-black/60 rounded px-1 text-[8px] text-white">Zoom 🔍</div>
                            </div>`;
                    }
                });

                mediaHtml = `
                    <div class="flex space-x-2 overflow-x-auto py-1 custom-scrollbar w-full">
                        ${itemsList}
                    </div>`;
            }

            div.innerHTML = `
                <button onclick="dismissItem('${cardId}')" class="absolute top-2 right-2 text-gray-400 hover:text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full bg-white/5 transition" title="Chiudi scheda">✕</button>
                <div class="text-[9px] font-space text-indigo-400 uppercase tracking-widest flex justify-between pr-6">
                    <span>${data.visibility === 'public' ? 'Glitch Pubblico' : 'Glitch Privato (Amici)'}</span>
                    <span class="text-white font-bold">${data.username}</span>
                </div>
                <p class="text-[11px] text-gray-200 font-medium">"${data.text}"</p>
                ${mediaHtml}
            `;
            liveNotifsContainer.appendChild(div);
        }

        // --- ZOOM MODALE FULLSCREEN ---
        const zoomModal = document.getElementById('media-zoom-modal');
        const zoomContainer = document.getElementById('zoom-content-container');

        window.openMediaZoom = function(type, url) {
            zoomContainer.innerHTML = '';
            if(type === 'video') {
                zoomContainer.innerHTML = `<video src="${url}" controls autoplay playsinline class="max-w-full max-h-[85vh] rounded-xl shadow-2xl"></video>`;
            } else {
                zoomContainer.innerHTML = `<img src="${url}" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl transition-transform duration-300 scale-100 cursor-zoom-in" onclick="this.style.transform = this.style.transform === 'scale(2)' ? 'scale(1)' : 'scale(2)'">`;
            }
            zoomModal.classList.remove('hidden');
        }

        window.closeMediaZoom = function() {
            zoomModal.classList.add('hidden');
            zoomContainer.innerHTML = '';
        }

        // --- GESTIONE NETWORK MODAL & AMICIZIA (VELOCE E PULITO) ---
        const networkModal = document.getElementById('network-modal');
        window.openNetworkModal = function() { networkModal.classList.remove('hidden'); fetchOnlineUsers(); }
        window.closeNetworkModal = function() { networkModal.classList.add('hidden'); }

        function fetchOnlineUsers(searchQuery = "") {
            const containerEl = document.getElementById('users-list-container');
            containerEl.innerHTML = ''; // Nessun testo lento, pulito subito

            db.collection("users").get().then((querySnapshot) => {
                containerEl.innerHTML = '';
                let count = 0;
                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    if(userData.id === myId) return;
                    if(searchQuery && !userData.username.toLowerCase().includes(searchQuery.toLowerCase())) return;

                    count++;
                    const isAlreadyFriend = myFriendsIds.includes(userData.id);

                    let actionBtnHtml = '';
                    if (isAlreadyFriend) {
                        actionBtnHtml = `<button onclick="removeFriend('${userData.id}', '${userData.username}')" class="px-2.5 py-1.5 rounded-lg text-[9px] font-space uppercase bg-rose-600/80 hover:bg-rose-600 text-white transition">- Rimuovi</button>`;
                    } else {
                        actionBtnHtml = `<button onclick="sendRealRequest('${userData.id}', '${userData.username}')" class="px-3 py-1.5 rounded-lg text-[10px] font-space uppercase bg-indigo-600 hover:bg-indigo-500 text-white transition">+ Amicizia</button>`;
                    }

                    containerEl.innerHTML += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/5 border border-white/10">
                            <div class="flex items-center space-x-2.5">
                                <img src="${userData.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces'}" class="w-8 h-8 rounded-full object-cover">
                                <div class="text-left">
                                    <div class="text-xs font-space text-white">${userData.username}</div>
                                    <div class="text-[9px] ${isAlreadyFriend ? 'text-indigo-400' : 'text-emerald-400'}">${isAlreadyFriend ? 'Amico Confermato' : 'Online nel Cloud'}</div>
                                </div>
                            </div>
                            ${actionBtnHtml}
                        </div>`;
                });

                if(count === 0) {
                    containerEl.innerHTML = `<p class="text-center text-gray-500 text-[11px] py-6">Nessun utente online trovato.</p>`;
                }
                document.getElementById('online-count-badge').innerText = `${count + 1} Online`;
                document.getElementById('modal-online-sub').innerText = `${count + 1} utenti attivi globali`;
            });
        }

        window.filterCloudUsers = function(query) { fetchOnlineUsers(query); }

        window.sendRealRequest = function(targetUserId, targetUsername) {
            db.collection("friend_requests").add({
                fromId: myId,
                fromUsername: savedUser,
                toId: targetUserId,
                toUsername: targetUsername,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert(`Richiesta inviata a ${targetUsername}!`);
                fetchOnlineUsers();
            });
        }

        window.removeFriend = function(targetUserId, targetUsername) {
            if(!confirm(`Vuoi rimuovere l'amicizia con ${targetUsername}?`)) return;

            db.collection("friend_requests").get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    if((d.fromId === myId && d.toId === targetUserId) || (d.fromId === targetUserId && d.toId === myId)) {
                        db.collection("friend_requests").doc(doc.id).delete().then(() => {
                            alert("Amicizia rimossa con successo.");
                            fetchMyFriends().then(() => {
                                fetchOnlineUsers();
                                loadAnomaliesFeed();
                            });
                        });
                    }
                });
            });
        }

        // --- INTERAZIONI UI & CARICAMENTO FILE ---
        const actionTrigger = document.getElementById('action-trigger');
        const inputPanel = document.getElementById('input-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const submitBtn = document.getElementById('submit-anomaly');
        const anomalyText = document.getElementById('anomaly-text');
        const anomalyMediaUrl = document.getElementById('anomaly-media-url');
        const anomalyFileInput = document.getElementById('anomaly-file-input');

        actionTrigger.addEventListener('click', () => { actionTrigger.classList.add('hidden'); inputPanel.classList.remove('hidden'); inputPanel.classList.add('flex'); });
        closePanelBtn.addEventListener('click', () => { inputPanel.classList.add('hidden'); inputPanel.classList.remove('flex'); actionTrigger.classList.remove('hidden'); });

        const profileModal = document.getElementById('profile-modal');
        window.openProfileModal = function() { profileModal.classList.remove('hidden'); }
        window.closeProfileModal = function() { profileModal.classList.add('hidden'); }

        window.saveProfile = function() {
            let rawName = document.getElementById('modal-username-input').value.trim();
            if(rawName) {
                if(!rawName.startsWith('@')) rawName = '@' + rawName;
                savedUser = rawName;
                localStorage.setItem('anomalia_username', savedUser);
                document.getElementById('username-display').innerText = savedUser;
            }
            let rawAvatar = document.getElementById('modal-avatar-input').value.trim();
            if(rawAvatar) {
                savedAvatar = rawAvatar;
                localStorage.setItem('anomalia_avatar', savedAvatar);
                document.getElementById('user-avatar-preview').src = savedAvatar;
            }
            updateMyOnlinePresence();
            closeProfileModal();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 900;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width; width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height; height = maxDim;
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        submitBtn.addEventListener('click', async () => {
            const textValue = anomalyText.value.trim();
            if(!textValue) { alert("Inserisci una descrizione per l'anomalia."); return; }

            const visibilityChoice = document.querySelector('input[name="visibility-type"]:checked').value;

            let finalMediaUrl = anomalyMediaUrl.value.trim();
            const fileInput = anomalyFileInput.files[0];

            if (fileInput) {
                submitBtn.disabled = true;
                submitBtn.innerText = "OTTIMIZZAZIONE IN CORSO...";

                try {
                    if (fileInput.type.startsWith('image/')) {
                        finalMediaUrl = await compressImage(fileInput);
                    } else {
                        if(fileInput.size > 8 * 1024 * 1024) {
                            alert("Il video è troppo pesante. Scegli un video più corto.");
                            submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                            submitBtn.disabled = false;
                            return;
                        }
                        submitBtn.innerText = "CARICAMENTO VIDEO...";
                        finalMediaUrl = await readFileAsDataURL(fileInput);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Errore durante l'elaborazione del file.");
                    submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                    submitBtn.disabled = false;
                    return;
                }
            }

            db.collection("anomalies").add({
                userId: myId,
                username: savedUser,
                text: textValue,
                mediaUrl: finalMediaUrl ? [finalMediaUrl] : [],
                visibility: visibilityChoice,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Anomalia trasmessa con successo!");
                inputPanel.classList.add('hidden');
                inputPanel.classList.remove('flex');
                actionTrigger.classList.remove('hidden');
                anomalyText.value = '';
                anomalyMediaUrl.value = '';
                anomalyFileInput.value = '';
                submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                submitBtn.disabled = false;
            }).catch((err) => {
                alert("Errore di registrazione nel database.");
                submitBtn.innerText = "TRASMETTI NEL GLOBO LIVE";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
